site_name: QilbeeDB Documentation
site_description: Enterprise Graph Database with Bi-Temporal Agent Memory
site_author: QilbeeDB Team
site_url: https://qilbeedb.com

repo_name: aicubetechnology/qilbeeDB
repo_url: https://github.com/aicubetechnology/qilbeeDB
edit_uri: edit/main/docs/

# The Markdown homepage owns index.html in the generated site.
exclude_docs: |
  /README.md
  /index.html

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aicubetechnology/qilbeeDB
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/qilbeedb/qilbeedb
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/qilbeedb

